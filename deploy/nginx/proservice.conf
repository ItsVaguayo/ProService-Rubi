# nginx de Pro Service Rubí. preparar-servidor.sh lo copia a /etc/nginx/sites-available/proservice
# cambiando DOMINIO_DEL_PANEL por el dominio. Sale de docs/produccion.md (sección nginx) y del ensayo del 19-oct.
# La CSP del panel es la de CSP_PANEL en api/src/seguridad.js: si cambia allí, cambiarla aquí.

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_DEL_PANEL;
    server_tokens off;

    # Let's Encrypt comprueba el dominio por aquí (certbot --webroot)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                        # nginx 1.25 o más nuevo; con uno más viejo: «listen 443 ssl http2;» y quitar esta línea
    server_name DOMINIO_DEL_PANEL;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO_DEL_PANEL/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO_DEL_PANEL/privkey.pem;

    # Lo estático (el panel) sale de la versión desplegada: al cambiar el enlace «current», cambia solo
    root /srv/proservice/current/frontend;
    client_max_body_size 1m;

    location = / { return 302 /panel/login.html; }
    location / { return 404; }

    location ~ ^/(panel|css|js|img)/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # Que el navegador pregunte siempre si ha cambiado (con 304 si no): el panel no lleva versión en los
        # nombres de sus .js y .css, y sin esto, tras desplegar, el navegador podría seguir con el JS viejo horas
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/fotos/ {
        client_max_body_size 400m;   # 25 fotos de 15 MB en una petición
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/contactos {
        client_max_body_size 55m;    # tasación: 5 fotos de 10 MB y los campos
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/wordpress/ {
        proxy_read_timeout 600s;     # bajar las fotos del stock tarda minutos
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
