<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotos · Ford Transit Custom 2156 MHB · ProService</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/panel.css">
</head>
<body>
<div class="app">

  <nav class="menu" aria-label="Menú principal">
    <a class="menu__marca" href="index.html"><img class="logo" src="../img/logo-proservice.webp" alt="Pro Service Rubí · Stock"></a>
    <details class="menu__movil"><summary>Menú</summary></details>
    <form class="menu__buscar" role="search" action="coches.html">
      <input type="search" name="q" placeholder="Buscar matrícula o modelo" aria-label="Buscar coche">
    </form>
    <div class="menu__enlaces">
      <a href="index.html"><span class="menu__icono" aria-hidden="true"></span>Tablero</a>
      <a href="coches.html" aria-current="page"><span class="menu__icono" aria-hidden="true"></span>Coches</a>
      <a href="coche-nuevo.html"><span class="menu__icono" aria-hidden="true"></span>Alta de vehículo</a>
      <a href="contactos.html"><span class="menu__icono" aria-hidden="true"></span>Contactos <span class="contador">3</span></a>
      <!-- Solo lo ve gerencia. Al comercial no le salen estos enlaces. -->
      <a class="menu__separado" href="informes.html"><span class="menu__icono" aria-hidden="true"></span>Informes</a>
      <a href="usuarios.html"><span class="menu__icono" aria-hidden="true"></span>Usuarios</a>
    </div>
    <div class="menu__usuario">
      <strong>Jaume</strong>
      Gerencia · <a href="login.html">Salir</a>
    </div>
  </nav>

  <main class="contenido">

    <!-- CABECERA en banda negra, como el tablero. Los datos del coche los pone js/fotos.js
         a partir de ?id= en la dirección (fotos.html?id=3). -->
    <header class="cabecera cabecera--portada">
      <div>
        <a class="volver" href="coche.html" data-enlace-ficha>← Volver a la ficha</a>
        <div class="ficha-cabecera__linea">
          <span class="matricula" data-coche="matricula">····</span>
          <span class="estado" data-coche="estado"></span>
        </div>
        <h1 data-coche="titulo">Fotos del coche</h1>
        <p class="nota">Súbelas en el orden de la lista. Hacen falta 15 para poder publicarlo; como mucho, 25.</p>
      </div>
      <div class="cabecera__acciones">
        <a class="boton boton--secundario" href="coche.html" data-enlace-ficha>Guardar y salir</a>
      </div>
    </header>

    <!-- AVISOS: errores de la API (foto que no se puede abrir, más de 25…) -->
    <p class="error" role="alert" data-error hidden></p>

    <!-- PROGRESO: cuántas lleva de las 15 obligatorias. Cuentan las que salen en la web y no son daños,
         igual que al publicar. -->
    <section class="progreso" aria-label="Fotos subidas">
      <div class="progreso__texto">
        <strong class="cifra" data-progreso="cifra">0 de 15</strong>
        <span class="nota" data-progreso="texto"></span>
      </div>
      <div class="progreso__barra"><span data-progreso="barra" style="width: 0%"></span></div>
    </section>

    <!-- ZONA DE SUBIDA. Al pulsar abre el selector de archivos; también se pueden arrastrar encima. -->
    <label class="subida" data-subida>
      <input class="oculto" type="file" name="fotos" accept="image/*" multiple>
      <span class="subida__titulo">Arrastra aquí las fotos o pulsa para elegirlas</span>
      <span class="nota" data-subida-nota>Puedes subir varias a la vez, tal cual salen del móvil. Se colocan solas en el primer hueco libre.</span>
    </label>

    <!-- LAS FOTOS EN SU ORDEN FIJO. Las pinta js/fotos.js con las plantillas de abajo:
         del 1 al 15 siempre (con foto o «Falta») y del 16 al 25 solo las que hay.
         Las fotos de daños no cuentan para las 15 y por defecto no salen en la web. -->
    <ol class="fotos-orden" data-lista>
      <li class="foto-fila foto-fila--falta">
        <span class="foto-fila__hueco">…</span>
        <div class="foto-fila__info"><strong>Cargando fotos</strong></div>
      </li>
    </ol>

    <!-- Plantilla de una foto subida -->
    <template id="plantilla-foto">
      <li class="foto-fila">
        <img src="" alt="" loading="lazy">
        <div class="foto-fila__info"><strong data-nombre></strong><span class="nota" data-detalle></span></div>
        <label class="casilla"><input type="checkbox" data-campo="publica"> En la web</label>
        <label class="casilla"><input type="checkbox" data-campo="es_dano"> Daño</label>
        <div class="foto-fila__mover">
          <button type="button" aria-label="Subir de posición" data-mover="-1">↑</button>
          <button type="button" aria-label="Bajar de posición" data-mover="1">↓</button>
        </div>
        <button class="foto-fila__quitar" type="button" data-quitar>Quitar</button>
      </li>
    </template>

    <!-- Plantilla de un hueco obligatorio sin foto -->
    <template id="plantilla-hueco">
      <li class="foto-fila foto-fila--falta">
        <span class="foto-fila__hueco">Falta</span>
        <div class="foto-fila__info"><strong data-nombre></strong><span class="nota" data-detalle></span></div>
      </li>
    </template>

  </main>
</div>
<script type="module" src="../js/panel.js"></script>
<script type="module" src="../js/fotos.js"></script>
</body>
</html>
